name: Build pdx234 LineageOS 24

on:
  push:
    branches: [lineage-24-maintenance]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'configs/**'
      - 'patches/**'
      - 'pdx234_defconfig'
  workflow_dispatch:
    inputs:
      enable_zram:
        description: 'Build LZ4KD and ZRAM into the kernel'
        type: boolean
        default: true
      enable_lz4:
        description: 'Also upgrade LZ4 to 1.10.0 (experimental, separate from LZ4KD)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: kernel-${{ github.ref }}-${{ inputs.enable_zram }}-${{ inputs.enable_lz4 }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ENABLE_ZRAM: ${{ github.event_name == 'push' || inputs.enable_zram }}
      ENABLE_LZ4: ${{ inputs.enable_lz4 }}
      BUILD_JOBS: '4'
      LTO_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare runner disk and tools
        run: |
          # GitHub runner only. All build output and compiler files stay on disk.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev \
            dwarves binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi zip curl git
          sudo swapoff -a
          sudo fallocate -l 36G /mnt/kernel-build.swap
          sudo chmod 600 /mnt/kernel-build.swap
          sudo mkswap /mnt/kernel-build.swap
          sudo swapon /mnt/kernel-build.swap
          sudo sysctl -w vm.swappiness=60
          df -h . /mnt
          free -h
      - name: Fetch pinned compiler
        run: |
          source configs/sources.env
          mkdir clang
          curl --fail --location --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$CLANG_REV/clang-$CLANG_VERSION.tar.gz" \
            -o clang.tar.gz
          sha256sum clang.tar.gz > clang-archive.sha256
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz
      - name: Prepare sources and patches
        run: |
          mkdir -p dist
          cp clang-archive.sha256 dist/
          scripts/prepare-kernel.sh 2>&1 | tee dist/prepare.log
      - name: Build and package
        run: scripts/build-kernel.sh 2>&1 | tee dist/build.log
      - name: Fetch manager matching pinned BakaSU commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source configs/sources.env
          RUN_ID=$(gh api "repos/Baka-SU/BakaSU/actions/workflows/build-manager.yml/runs?head_sha=$KSU_SHA&status=success&per_page=10" \
            --jq '.workflow_runs[0].id // empty')
          test -n "$RUN_ID"
          test "$(gh api "repos/Baka-SU/BakaSU/actions/runs/$RUN_ID" --jq '.head_sha')" = "$KSU_SHA"
          gh run download "$RUN_ID" --repo Baka-SU/BakaSU --name Manager-release --dir work/manager
          find work/manager -name '*arm64-v8a*.apk' -exec cp '{}' dist/ ';'
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          printf 'BakaSU SHA: %s\nManager run: %s\n' "$KSU_SHA" "$RUN_ID" > dist/manager-source.txt
          (cd dist && sha256sum ./*.apk >> SHA256SUMS)
      - name: Upload build evidence and artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdx234-lineage24-bakasu-zram-${{ env.ENABLE_ZRAM }}-lz4-${{ env.ENABLE_LZ4 }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  build-spoofed-manager:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build Spoofed Manager APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source configs/sources.env
          mkdir -p work
          git init work/BakaSU
          git -C work/BakaSU remote add origin "$KSU_REPO"
          git -C work/BakaSU fetch --depth 1 origin "$KSU_SHA"
          git -C work/BakaSU checkout --detach FETCH_HEAD

          RUN_ID=$(gh api "repos/Baka-SU/BakaSU/actions/workflows/build-manager.yml/runs?head_sha=$KSU_SHA&status=success&per_page=10" \
            --jq '.workflow_runs[0].id // empty')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo Baka-SU/BakaSU --name ksud-aarch64-linux-android --dir work/BakaSU/ksud-arm64
          mkdir -p work/BakaSU/target/aarch64-linux-android/release
          cp work/BakaSU/ksud-arm64/ksud work/BakaSU/target/aarch64-linux-android/release/ksud
          chmod +x work/BakaSU/target/aarch64-linux-android/release/ksud

          w1=$(tr -dc 'a-z' </dev/urandom | head -c6)
          w2=$(tr -dc 'a-z' </dev/urandom | head -c6)
          w3=$(tr -dc 'a-z' </dev/urandom | head -c6)
          PKG_NAME="${w1}.${w2}.${w3}"
          echo "Building manager with package name: $PKG_NAME"

          cd work/BakaSU/manager
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pcommit="$KSU_SHA" \
            -PKSU_PACKAGE_NAME="$PKG_NAME" \
            -PKSU_NAME="BakaSU" \
            -PIS_SPOOFED_BUILD=true

          cd ..
          keytool -genkeypair -alias baka -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bakasu -keypass bakasu -dname "CN=BakaSU,O=Android,C=US" \
            -keystore key.jks

          python3 repack_apk_multi.py repack \
            -b release \
            -t release \
            -a arm64-v8a \
            -K key.jks \
            -A baka \
            -P bakasu \
            -S bakasu

          mkdir -p "$GITHUB_WORKSPACE/dist-manager"
          cp dist/*.apk "$GITHUB_WORKSPACE/dist-manager/"
          echo "Package Name: $PKG_NAME" > "$GITHUB_WORKSPACE/dist-manager/package_info.txt"
          echo "BakaSU Commit: $KSU_SHA" >> "$GITHUB_WORKSPACE/dist-manager/package_info.txt"
          (cd "$GITHUB_WORKSPACE/dist-manager" && sha256sum ./*.apk >> SHA256SUMS)

      - name: Upload Spoofed Manager
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdx234-bakasu-spoofed-manager
          path: dist-manager/

